<text class="c" x="16" y="80.8" xml:space="preserve"><tspan fill="#5f5f6b">name: composing</tspan></text>
<text class="c" x="16" y="98.8" xml:space="preserve"><tspan fill="#5f5f6b">description: write report</tspan></text>
<text class="c" x="16" y="116.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="134.8" xml:space="preserve"><tspan fill="#7ea6f0">{% extends &quot;partials/base.md&quot; %}</tspan></text>
<text class="c" x="16" y="152.8" xml:space="preserve"><tspan fill="#7ea6f0">{% import &quot;partials/style.md&quot; as style with context %}</tspan></text>
<text class="c" x="16" y="170.8" xml:space="preserve"><tspan fill="#7ea6f0">{% block report %}</tspan></text>
<text class="c" x="16" y="188.8" xml:space="preserve"><tspan fill="#7ea6f0">{% stage report %}</tspan></text>
<text class="c" x="16" y="206.8" xml:space="preserve"><tspan fill="#dcdce2">Write what was gathered about </tspan><tspan fill="#e0a458">{{ input.topic }}</tspan><tspan fill="#dcdce2"> to `report.md`.</tspan></text>
<text class="c" x="16" y="242.8" xml:space="preserve"><tspan fill="#e0a458">{{ style.audience(input.audience | default(&quot;meetup&quot;)) }}</tspan></text>
<text class="c" x="16" y="260.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endstage %}</tspan></text>
<text class="c" x="16" y="278.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endblock %}</tspan></text>
