<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 649" width="1350" height="649">
<style>.t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13.0px;dominant-baseline:middle;white-space:pre}.c{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11.0px;dominant-baseline:middle;white-space:pre}@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes k0{0%,3.042%{opacity:0}4.259%,95%{opacity:1}100%{opacity:0}}@keyframes k1{0%,11.027%{opacity:0}12.243%,95%{opacity:1}100%{opacity:0}}@keyframes k2{0%,19.011%{opacity:0}20.228%,95%{opacity:1}100%{opacity:0}}@keyframes k3{0%,26.996%{opacity:0}28.213%,95%{opacity:1}100%{opacity:0}}@keyframes k4{0%,34.981%{opacity:0}36.198%,95%{opacity:1}100%{opacity:0}}@keyframes k5{0%,42.966%{opacity:0}44.183%,95%{opacity:1}100%{opacity:0}}@keyframes k6{0%,50.951%{opacity:0}52.167%,95%{opacity:1}100%{opacity:0}}</style>
<defs><marker id="ajev" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#7ea6f0"/></marker><marker id="astep" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#e0a458"/></marker></defs>
<rect x="0" y="0" width="615" height="649" rx="9" fill="#0a0a0c"/><rect x="0.5" y="0.5" width="614" height="648" rx="9" fill="none" stroke="#23232a"/>
<g stroke="#2c2c35" stroke-width="1">
<line x1="19" y1="179.8" x2="19" y2="395.8"/>
<line x1="32.2" y1="197.8" x2="32.2" y2="377.8"/>
<line x1="45.4" y1="215.8" x2="45.4" y2="359.8"/>
<line x1="58.6" y1="233.8" x2="58.6" y2="341.8"/>
<line x1="85" y1="287.8" x2="85" y2="341.8"/>
<line x1="19" y1="467.8" x2="19" y2="503.8"/>
</g>
<text class="c" x="16" y="34.0" xml:space="preserve"><tspan fill="#d97757">▌ </tspan><tspan fill="#dcdce2" font-weight="600">SKILL.md</tspan></text>
<text class="c" x="16" y="62.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="80.8" xml:space="preserve"><tspan fill="#5f5f6b">name: tech-debt-by-file</tspan></text>
<text class="c" x="16" y="98.8" xml:space="preserve"><tspan fill="#5f5f6b">description: Rank source files by technical debt and its main kind.</tspan></text>
<text class="c" x="16" y="116.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="134.8" xml:space="preserve"><tspan fill="#7ea6f0">{% set levels = [&quot;clean&quot;, &quot;some smell&quot;, &quot;hard to change&quot;, &quot;dangerous to touch&quot;] %}</tspan></text>
<text class="c" x="16" y="170.8" xml:space="preserve"><tspan fill="#7ea6f0">{% bundle audit %}</tspan></text>
<text class="c" x="16" y="188.8" xml:space="preserve"><tspan fill="#7ea6f0">  {% for path in find_files(&quot;src/.*[.]py&quot;) %}</tspan></text>
<text class="c" x="16" y="206.8" xml:space="preserve"><tspan fill="#7ea6f0">    {% agent debt key=path %}</tspan></text>
<text class="c" x="16" y="224.8" xml:space="preserve"><tspan fill="#e0a458">      {{ decision(</tspan></text>
<text class="c" x="16" y="242.8" xml:space="preserve"><tspan fill="#e0a458">          level=score(&quot;How much technical debt?&quot;, levels),</tspan></text>
<text class="c" x="16" y="260.8" xml:space="preserve"><tspan fill="#e0a458">          kind=choice(&quot;Its main kind of debt?&quot;, {&quot;duplication&quot;: …, &quot;none&quot;: …}),</tspan></text>
<text class="c" x="16" y="278.8" xml:space="preserve"><tspan fill="#e0a458">          quick_win=yesno(</tspan></text>
<text class="c" x="16" y="296.8" xml:space="preserve"><tspan fill="#e0a458">              &quot;Can its main debt be fixed in under a day, in this file alone?&quot;,</tspan></text>
<text class="c" x="16" y="314.8" xml:space="preserve"><tspan fill="#e0a458">              yes=&quot;a local fix; no other module changes&quot;,</tspan></text>
<text class="c" x="16" y="332.8" xml:space="preserve"><tspan fill="#e0a458">              no=&quot;the fix spans modules or interfaces, or there is no debt&quot;)) }}</tspan></text>
<text class="c" x="16" y="350.8" xml:space="preserve"><tspan fill="#e0a458">      {{ decision_state_from_file(path) }}</tspan></text>
<text class="c" x="16" y="368.8" xml:space="preserve"><tspan fill="#7ea6f0">    {% endagent %}</tspan></text>
<text class="c" x="16" y="386.8" xml:space="preserve"><tspan fill="#7ea6f0">  {% endfor %}</tspan></text>
<text class="c" x="16" y="404.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endbundle %}</tspan></text>
<text class="c" x="16" y="440.8" xml:space="preserve"><tspan fill="#dcdce2">Show the user this list, as it is:</tspan></text>
<text class="c" x="16" y="458.8" xml:space="preserve"><tspan fill="#7ea6f0">{% for path, a in audit.debt.items() | sort(attribute=&quot;1.level.value&quot;, reverse=true) %}</tspan></text>
<text class="c" x="16" y="476.8" xml:space="preserve"><tspan fill="#dcdce2">  - </tspan><tspan fill="#e0a458">{{ path }}</tspan><tspan fill="#dcdce2">: </tspan><tspan fill="#e0a458">{{ a.level.label }}</tspan><tspan fill="#dcdce2"> (</tspan><tspan fill="#e0a458">{{ a.level.value | round(1) }}</tspan><tspan fill="#dcdce2">), </tspan><tspan fill="#e0a458">{{ a.kind.value }}</tspan></text>
<text class="c" x="16" y="494.8" xml:space="preserve"><tspan fill="#e0a458">    {{- &quot;, quick win&quot; if a.quick_win.value &gt;= 0.5 }}</tspan></text>
<text class="c" x="16" y="512.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endfor %}</tspan></text>
<rect x="735" y="0" width="615" height="649" rx="9" fill="#0d0d10"/><rect x="735.5" y="0.5" width="614" height="648" rx="9" fill="none" stroke="#23232a"/>
<g><text class="t" x="761.0" y="34.0" xml:space="preserve"><tspan fill="#d97757">✻ </tspan><tspan fill="#dcdce2" font-weight="600">Claude Code / Opencode / Codex / PI</tspan></text></g>
<g style="opacity:0;animation:k0 26.3s linear infinite"><text class="t" x="761.0" y="73.6" xml:space="preserve"><tspan fill="#74747f">&gt; </tspan><tspan fill="#dcdce2">/llajinja run /tech-debt-by-file skill</tspan></text></g>
<g style="opacity:0;animation:k1 26.3s linear infinite"><text class="t" x="761.0" y="117.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Skill(llajinja)</tspan></text></g>
<g style="opacity:0;animation:k1 26.3s linear infinite"><text class="t" x="776.6" y="139.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">executing the tech-debt-by-file skill, step by step</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><rect x="761" y="165" width="563" height="132" rx="6" fill="#dcdce2" fill-opacity="0.06" stroke="#dcdce2" stroke-opacity="0.75" stroke-width="1.5"/></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="777" y="187.6" xml:space="preserve"><tspan fill="#dcdce2" font-weight="600">Decision model (Jev, Clef, Nimble ...)</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="777" y="209.6" xml:space="preserve"><tspan fill="#74747f">outside this session — the files never enter its context</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="777" y="237.6" xml:space="preserve"><tspan fill="#7ea6f0">→ </tspan><tspan fill="#dcdce2">20 files as state, from decision_state_from_file(path)</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="777" y="259.6" xml:space="preserve"><tspan fill="#7ea6f0">→ </tspan><tspan fill="#dcdce2">per file: score · choice · noul</tspan></text></g>
<g style="opacity:0;animation:k3 26.3s linear infinite"><text class="t" x="777" y="281.6" xml:space="preserve"><tspan fill="#8fbf6f">← </tspan><tspan fill="#dcdce2">20 answers in ~2 s, back to the driver</tspan></text></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><text class="t" x="761.0" y="335.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#e0a458" font-weight="600">Next step — stage: show the list</tspan></text></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><text class="t" x="776.6" y="357.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">rendered from Jev's answers, worst first</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="761.0" y="401.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2">utils.py: hard to change (1.8), obsolete</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="423.6" xml:space="preserve"><tspan fill="#dcdce2">auth.py: hard to change (1.7), error-handling</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="445.6" xml:space="preserve"><tspan fill="#dcdce2">ratelimit.py: some smell (1.6), error-handling, quick win</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="467.6" xml:space="preserve"><tspan fill="#74747f">... 20 rows</tspan></text></g>
<g style="opacity:0;animation:k6 26.3s linear infinite"><text class="t" x="761.0" y="511.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#8fbf6f" font-weight="600">Run finished — 20 files rated by Jev, none read here</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><rect x="9" y="161.6" width="597" height="252.3" rx="4" fill="#7ea6f0" fill-opacity="0.13" stroke="#7ea6f0" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><path d="M606.0 287.8 C680 287.8 680 237.6 757.0 237.6" fill="none" stroke="#7ea6f0" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 287.8 C680 287.8 680 237.6 757.0 237.6" fill="none" stroke="#7ea6f0" stroke-width="2" opacity="0.95" marker-end="url(#ajev)"/></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><rect x="9" y="431.6" width="597" height="90.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><path d="M606.0 476.8 C672 476.8 672 335.6 739.0 335.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 476.8 C672 476.8 672 335.6 739.0 335.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#astep)"/></g>
<rect x="761" y="559.6" width="563" height="46.0" rx="9" fill="none" stroke="#32323c"/>
