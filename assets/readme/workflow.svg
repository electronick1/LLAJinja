<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 739" width="1350" height="739">
<style>.t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13.0px;dominant-baseline:middle;white-space:pre}.c{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11.0px;dominant-baseline:middle;white-space:pre}@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes k0{0%,2.623%{opacity:0}3.672%,95%{opacity:1}100%{opacity:0}}@keyframes k1{0%,9.508%{opacity:0}10.557%,95%{opacity:1}100%{opacity:0}}@keyframes k2{0%,16.393%{opacity:0}17.443%,95%{opacity:1}100%{opacity:0}}@keyframes k3{0%,23.279%{opacity:0}24.328%,95%{opacity:1}100%{opacity:0}}@keyframes k4{0%,30.164%{opacity:0}31.213%,95%{opacity:1}100%{opacity:0}}@keyframes k5{0%,37.049%{opacity:0}38.098%,95%{opacity:1}100%{opacity:0}}@keyframes k6{0%,43.934%{opacity:0}44.984%,95%{opacity:1}100%{opacity:0}}@keyframes k7{0%,50.820%{opacity:0}51.869%,95%{opacity:1}100%{opacity:0}}@keyframes k8{0%,57.705%{opacity:0}58.754%,95%{opacity:1}100%{opacity:0}}</style>
<defs><marker id="atask" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#7ea6f0"/></marker><marker id="avar" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#e0a458"/></marker><marker id="astep" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#e0a458"/></marker></defs>
<rect x="0" y="0" width="615" height="739" rx="9" fill="#0a0a0c"/><rect x="0.5" y="0.5" width="614" height="738" rx="9" fill="none" stroke="#23232a"/>
<text class="c" x="16" y="34.0" xml:space="preserve"><tspan fill="#d97757">▌ </tspan><tspan fill="#dcdce2" font-weight="600">SKILL.md</tspan></text>
<text class="c" x="16" y="62.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="80.8" xml:space="preserve"><tspan fill="#5f5f6b">name: workflow</tspan></text>
<text class="c" x="16" y="98.8" xml:space="preserve"><tspan fill="#5f5f6b">description: Space and moons.</tspan></text>
<text class="c" x="16" y="116.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="152.8" xml:space="preserve"><tspan fill="#7ea6f0">{% agent propose outputs={&quot;planet&quot;: &quot;the planet named&quot;, &quot;moons&quot;: &quot;its moon count&quot;} %}</tspan></text>
<text class="c" x="16" y="170.8" xml:space="preserve"><tspan fill="#dcdce2">    Name the planet with the most moons, and how many, from memory.</tspan></text>
<text class="c" x="16" y="188.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endagent %}</tspan></text>
<text class="c" x="16" y="224.8" xml:space="preserve"><tspan fill="#7ea6f0">{% agent check outputs={&quot;verdict&quot;: &quot;accept or revise&quot;, &quot;problems&quot;: &quot;what is wrong, or</tspan></text>
<text class="c" x="16" y="242.8" xml:space="preserve"><tspan fill="#dcdce2">  </tspan><tspan fill="#7ea6f0">&#x27;none&#x27;&quot;} %}</tspan></text>
<text class="c" x="16" y="260.8" xml:space="preserve"><tspan fill="#dcdce2">    Weigh the claim that </tspan><tspan fill="#e0a458">{{ propose.planet }}</tspan><tspan fill="#dcdce2"> leads with </tspan><tspan fill="#e0a458">{{ propose.moons }}</tspan><tspan fill="#dcdce2"> moons</tspan></text>
<text class="c" x="16" y="278.8" xml:space="preserve"><tspan fill="#dcdce2">  </tspan><tspan fill="#dcdce2">against</tspan></text>
<text class="c" x="16" y="296.8" xml:space="preserve"><tspan fill="#dcdce2">    the other seven planets, from memory, and say whether it holds.</tspan></text>
<text class="c" x="16" y="314.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endagent %}</tspan></text>
<text class="c" x="16" y="350.8" xml:space="preserve"><tspan fill="#7ea6f0">{% if check.verdict == &quot;revise&quot; %}</tspan></text>
<text class="c" x="16" y="368.8" xml:space="preserve"><tspan fill="#dcdce2">    </tspan><tspan fill="#7ea6f0">{% agent correct outputs={&quot;planet&quot;: &quot;the planet that leads&quot;, &quot;moons&quot;: &quot;its moon</tspan></text>
<text class="c" x="16" y="386.8" xml:space="preserve"><tspan fill="#dcdce2">  </tspan><tspan fill="#7ea6f0">count&quot;} %}</tspan></text>
<text class="c" x="16" y="404.8" xml:space="preserve"><tspan fill="#dcdce2">        </tspan><tspan fill="#e0a458">{{ propose.planet }}</tspan><tspan fill="#dcdce2"> was rejected for this: </tspan><tspan fill="#e0a458">{{ check.problems }}</tspan></text>
<text class="c" x="16" y="422.8" xml:space="preserve"><tspan fill="#dcdce2">        Name the planet that does lead, and by how many moons.</tspan></text>
<text class="c" x="16" y="440.8" xml:space="preserve"><tspan fill="#dcdce2">    </tspan><tspan fill="#7ea6f0">{% endagent %}</tspan></text>
<text class="c" x="16" y="458.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endif %}</tspan></text>
<rect x="735" y="0" width="615" height="739" rx="9" fill="#0d0d10"/><rect x="735.5" y="0.5" width="614" height="738" rx="9" fill="none" stroke="#23232a"/>
<g><text class="t" x="761.0" y="34.0" xml:space="preserve"><tspan fill="#d97757">✻ </tspan><tspan fill="#dcdce2" font-weight="600">Claude Code / Opencode / Codex / PI</tspan></text></g>
<g style="opacity:0;animation:k0 30.5s linear infinite"><text class="t" x="761.0" y="73.6" xml:space="preserve"><tspan fill="#74747f">&gt; </tspan><tspan fill="#dcdce2">/llajinja run /workflow skill</tspan></text></g>
<g style="opacity:0;animation:k1 30.5s linear infinite"><text class="t" x="761.0" y="117.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Skill(llajinja)</tspan></text></g>
<g style="opacity:0;animation:k1 30.5s linear infinite"><text class="t" x="776.6" y="139.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">executing the workflow skill — I take each step it names, in order</tspan></text></g>
<g style="opacity:0;animation:k2 30.5s linear infinite"><text class="t" x="761.0" y="183.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#7ea6f0" font-weight="600">Next step — sub-agent: propose</tspan></text></g>
<g style="opacity:0;animation:k2 30.5s linear infinite"><text class="t" x="776.6" y="205.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">Name the planet with the most moons, and how many, from memory.</tspan></text></g>
<g style="opacity:0;animation:k3 30.5s linear infinite"><text class="t" x="761.0" y="249.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Agent(propose)</tspan></text></g>
<g style="opacity:0;animation:k3 30.5s linear infinite"><text class="t" x="776.6" y="271.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">worked in its own context and reported back: Jupiter, 95 moons</tspan></text></g>
<g style="opacity:0;animation:k4 30.5s linear infinite"><text class="t" x="761.0" y="315.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#7ea6f0" font-weight="600">Next step — sub-agent: check</tspan></text></g>
<g style="opacity:0;animation:k4 30.5s linear infinite"><text class="t" x="776.6" y="337.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">built from what propose reported, so it names Jupiter and 95</tspan></text></g>
<g style="opacity:0;animation:k5 30.5s linear infinite"><text class="t" x="761.0" y="381.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Agent(check)</tspan></text></g>
<g style="opacity:0;animation:k5 30.5s linear infinite"><text class="t" x="776.6" y="403.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">reported back: verdict revise — Saturn&#x27;s 146 moons put it first</tspan></text></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><text class="t" x="761.0" y="447.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#7ea6f0" font-weight="600">Next step — sub-agent: correct</tspan></text></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><text class="t" x="776.6" y="469.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">the skill&#x27;s condition is true for verdict = revise</tspan></text></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><text class="t" x="776.6" y="491.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">carries what check reported into the prompt</tspan></text></g>
<g style="opacity:0;animation:k7 30.5s linear infinite"><text class="t" x="761.0" y="535.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Agent(correct)</tspan></text></g>
<g style="opacity:0;animation:k7 30.5s linear infinite"><text class="t" x="776.6" y="557.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">reported back: Saturn leads with 146, ahead of Jupiter&#x27;s 95</tspan></text></g>
<g style="opacity:0;animation:k8 30.5s linear infinite"><text class="t" x="761.0" y="601.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#8fbf6f" font-weight="600">Run finished — three Tasks, each one framed by the last</tspan></text></g>
<g style="opacity:0;animation:k3 30.5s linear infinite"><rect x="9" y="141.6" width="597" height="58.3" rx="4" fill="#7ea6f0" fill-opacity="0.13" stroke="#7ea6f0" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k3 30.5s linear infinite"><path d="M606.0 170.8 C672 170.8 672 249.6 739.0 249.6" fill="none" stroke="#7ea6f0" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 170.8 C672 170.8 672 249.6 739.0 249.6" fill="none" stroke="#7ea6f0" stroke-width="2" opacity="0.95" marker-end="url(#atask)"/></g>
<g style="opacity:0;animation:k4 30.5s linear infinite"><rect x="9" y="249.6" width="597" height="22.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k4 30.5s linear infinite"><path d="M606.0 260.8 C672 260.8 672 337.6 739.0 337.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 260.8 C672 260.8 672 337.6 739.0 337.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#avar)"/></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><rect x="9" y="339.6" width="597" height="130.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><path d="M606.0 404.8 C672 404.8 672 469.6 739.0 469.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 404.8 C672 404.8 672 469.6 739.0 469.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#astep)"/></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><rect x="9" y="393.6" width="597" height="22.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k6 30.5s linear infinite"><path d="M606.0 404.8 C672 404.8 672 491.6 739.0 491.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 404.8 C672 404.8 672 491.6 739.0 491.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#avar)"/></g>
