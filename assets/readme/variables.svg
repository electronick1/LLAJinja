<text class="c" x="16" y="134.8" xml:space="preserve"><tspan fill="#dcdce2">Write one paragraph about </tspan><tspan fill="#e0a458">{{ input.topic }}</tspan><tspan fill="#dcdce2">.</tspan></text>
<text class="c" x="16" y="170.8" xml:space="preserve"><tspan fill="#dcdce2">Keep the tone </tspan><tspan fill="#e0a458">{{ input.tone | default(&quot;plain&quot;) }}</tspan><tspan fill="#dcdce2">.</tspan></text>
