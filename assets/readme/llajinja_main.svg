<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 673" width="1350" height="673">
  <style>
    .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;dominant-baseline:middle;white-space:pre}
    .sm{font-size:11px}.base{font-size:13px}.input{font-size:18px}.head{font-size:14px;font-weight:600}.win{font-size:12px}
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes focus{0%,100%{fill-opacity:.095;stroke-opacity:.55}50%{fill-opacity:.15;stroke-opacity:.85}}
    .blink{animation:cursor 1.1s step-end infinite}
    .focus{animation:focus 5s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.blink,.focus{animation:none}}
  </style>
  <defs>
    <linearGradient id="windowTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d23"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
    <clipPath id="windowClip"><rect x="1" y="1" width="1348" height="671" rx="16"/></clipPath>
    <marker id="tinyArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0.5 L8.5 4 L0 7.5 Z" fill="#e0a458"/>
    </marker>
  </defs>
<rect x="1" y="1" width="1348" height="671" rx="16" fill="#0a0a0c" stroke="#474750" stroke-width="1.5"/>
  <g clip-path="url(#windowClip)">
    <rect x="1" y="1" width="1348" height="59" fill="url(#windowTop)"/>
    <path d="M1 60 H1349" stroke="#32323c" stroke-width="1"/>
  </g>
  <circle cx="30" cy="30" r="6" fill="#d97757"/>
  <circle cx="51" cy="30" r="6" fill="#e0a458"/>
  <circle cx="72" cy="30" r="6" fill="#8fbf6f"/>
  <text class="mono win" x="108" y="31" font-weight="600" fill="#dcdce2">LLAJinja</text>
  <text class="mono win" x="675" y="31" fill="#b9b9c3" text-anchor="middle">Claude Code / Codex / OpenCode / PI / …</text>
  <text class="mono sm" x="1317" y="31" fill="#74747f" text-anchor="end">~/project</text>
<g transform="translate(0 62)">
<g transform="translate(0 40)">
<rect x="252" y="168" width="350" height="111" rx="8" fill="#0d0d10" stroke="#2c2c35"/>
  <rect x="273" y="186" width="3" height="14" fill="#d97757"/>
  <text class="mono head" x="286" y="193" fill="#dcdce2">LLAJinja skill</text>
  <text class="mono sm" x="273" y="230" fill="#dcdce2">No extensions or plugins</text>
  <text class="mono sm" x="273" y="254" fill="#74747f">Any harness with skill loading</text>

  <rect x="631" y="168" width="399" height="111" rx="8" fill="#0d0d10" stroke="#2c2c35"/>
  <rect x="652" y="186" width="3" height="14" fill="#d97757"/>
  <text class="mono head" x="665" y="193" fill="#dcdce2">Your Jinja-templated skill</text>
  <text class="mono sm" x="652" y="230" fill="#dcdce2">Variables, stages and sub-agents</text>
  <text class="mono sm" x="652" y="254" fill="#74747f">Imports and extends other skills</text>

  <path d="M427 279 L427 311" stroke="#e0a458" stroke-width="1.5" fill="none" marker-end="url(#tinyArrow)" opacity=".94"/>
  <path d="M749 279 L749 310" stroke="#e0a458" stroke-width="5" opacity="0.16" fill="none" stroke-linecap="round"/>
  <path d="M749 279 L749 310" stroke="#e0a458" stroke-width="1.8" fill="none" marker-end="url(#tinyArrow)" opacity=".97"/>
<rect x="38" y="318" width="1274" height="74" rx="9" fill="#0d0d10" stroke="#32323c"/>
  <text class="mono input" x="66" y="355" fill="#d97757">&gt;</text>
  <rect class="focus" x="338" y="332" width="180" height="46" rx="5" fill="#e0a458" fill-opacity=".095" stroke="#e0a458" stroke-opacity=".55"/>
  <text class="mono input" x="356" y="355" fill="#e0a458" font-weight="600">/llajinja</text>
  <text class="mono input" x="545" y="355" fill="#dcdce2">run</text>
  <rect class="focus" x="614" y="332" width="270" height="46" rx="5" fill="#e0a458" fill-opacity=".095" stroke="#e0a458" stroke-opacity=".55"/>
  <text class="mono input" x="632" y="355" fill="#e0a458" font-weight="600">/your-jinja-skill</text>
  <text class="mono input" x="905" y="355" fill="#dcdce2">do great things</text>
  <rect class="blink" x="1080" y="342" width="10" height="26" fill="#dcdce2"/>
  <text class="mono sm" x="49" y="414" fill="#74747f">? for shortcuts</text>
  <path d="M1165 409 L1171 413 L1165 417 Z M1173 409 L1179 413 L1173 417 Z" fill="#74747f"/>
  <text class="mono sm" x="1186" y="414" fill="#74747f">accept edits on</text>

  </g>
<path d="M55 472 H1295" stroke="#23232a"/>
  <rect x="69" y="496" width="3" height="14" fill="#e0a458"/>
  <text class="mono sm" x="83" y="504" fill="#e0a458" font-weight="600">ITERATIVE RENDERING RUNTIME</text>
  <text class="mono base" x="69" y="537" fill="#dcdce2">The Jinja-templated skill is rendered iteratively by stages or sub-agents throughout execution as a resumable state machine.</text>
  <text class="mono sm" x="69" y="572"><tspan fill="#74747f">harness </tspan><tspan fill="#e0a458"> &gt; </tspan><tspan fill="#74747f"> render next stage or sub-agent </tspan><tspan fill="#e0a458"> &gt; </tspan><tspan fill="#74747f"> execute </tspan><tspan fill="#e0a458"> &gt; </tspan><tspan fill="#74747f"> repeat </tspan><tspan fill="#e0a458"> &gt; </tspan><tspan fill="#8fbf6f"> finish</tspan></text>
  </g>
</svg>
