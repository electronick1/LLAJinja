<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 673" width="1350" height="673">
<style>.t{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13.0px;dominant-baseline:middle;white-space:pre}.c{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11.0px;dominant-baseline:middle;white-space:pre}@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes k0{0%,3.042%{opacity:0}4.259%,95%{opacity:1}100%{opacity:0}}@keyframes k1{0%,11.027%{opacity:0}12.243%,95%{opacity:1}100%{opacity:0}}@keyframes k2{0%,19.011%{opacity:0}20.228%,95%{opacity:1}100%{opacity:0}}@keyframes k3{0%,26.996%{opacity:0}28.213%,95%{opacity:1}100%{opacity:0}}@keyframes k4{0%,34.981%{opacity:0}36.198%,95%{opacity:1}100%{opacity:0}}@keyframes k5{0%,42.966%{opacity:0}44.183%,95%{opacity:1}100%{opacity:0}}@keyframes k6{0%,50.951%{opacity:0}52.167%,95%{opacity:1}100%{opacity:0}}</style>
<defs><marker id="astep" markerWidth="11" markerHeight="9" refX="9.5" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5 z" fill="#e0a458"/></marker></defs>
<rect x="0" y="0" width="615" height="673" rx="9" fill="#0a0a0c"/><rect x="0.5" y="0.5" width="614" height="672" rx="9" fill="none" stroke="#23232a"/>
<text class="c" x="16" y="34.0" xml:space="preserve"><tspan fill="#d97757">▌ </tspan><tspan fill="#dcdce2" font-weight="600">SKILL.md</tspan></text>
<text class="c" x="16" y="62.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="80.8" xml:space="preserve"><tspan fill="#5f5f6b">name: stages</tspan></text>
<text class="c" x="16" y="98.8" xml:space="preserve"><tspan fill="#5f5f6b">description: The eight planets, then Kepler&#x27;s third law checked against them.</tspan></text>
<text class="c" x="16" y="116.8" xml:space="preserve"><tspan fill="#5f5f6b">---</tspan></text>
<text class="c" x="16" y="134.8" xml:space="preserve"><tspan fill="#7ea6f0">{% stage orbits %}</tspan></text>
<text class="c" x="16" y="152.8" xml:space="preserve"><tspan fill="#dcdce2">Print one table here, in this session: a row for each of the eight planets, with the</tspan></text>
<text class="c" x="16" y="170.8" xml:space="preserve"><tspan fill="#dcdce2">columns Planet, Mean distance from the Sun in AU, and Orbital period in Earth years.</tspan></text>
<text class="c" x="16" y="188.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endstage %}</tspan></text>
<text class="c" x="16" y="206.8" xml:space="preserve"><tspan fill="#7ea6f0">{% stage kepler %}</tspan></text>
<text class="c" x="16" y="224.8" xml:space="preserve"><tspan fill="#dcdce2">Print a second table from the first: a row per planet, with the columns Planet, distance</tspan></text>
<text class="c" x="16" y="242.8" xml:space="preserve"><tspan fill="#dcdce2">cubed, period squared, and the ratio of the two.</tspan></text>
<text class="c" x="16" y="278.8" xml:space="preserve"><tspan fill="#dcdce2">Under it, say how close those ratios come to a single constant, and which planet strays</tspan></text>
<text class="c" x="16" y="296.8" xml:space="preserve"><tspan fill="#dcdce2">furthest from it.</tspan></text>
<text class="c" x="16" y="314.8" xml:space="preserve"><tspan fill="#7ea6f0">{% endstage %}</tspan></text>
<rect x="735" y="0" width="615" height="673" rx="9" fill="#0d0d10"/><rect x="735.5" y="0.5" width="614" height="672" rx="9" fill="none" stroke="#23232a"/>
<g><text class="t" x="761.0" y="34.0" xml:space="preserve"><tspan fill="#d97757">✻ </tspan><tspan fill="#dcdce2" font-weight="600">Claude Code / OpenCode / Codex / PI</tspan></text></g>
<g style="opacity:0;animation:k0 26.3s linear infinite"><text class="t" x="761.0" y="73.6" xml:space="preserve"><tspan fill="#74747f">&gt; </tspan><tspan fill="#dcdce2">/llajinja run /stages skill</tspan></text></g>
<g style="opacity:0;animation:k1 26.3s linear infinite"><text class="t" x="761.0" y="117.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2" font-weight="600">Skill(llajinja)</tspan></text></g>
<g style="opacity:0;animation:k1 26.3s linear infinite"><text class="t" x="776.6" y="139.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">executing the stages skill — I take each step it names, in order</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="761.0" y="183.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#e0a458" font-weight="600">Next step — stage: orbits</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><text class="t" x="776.6" y="205.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">Print one table of the eight planets: distance in AU, period in years.</tspan></text></g>
<g style="opacity:0;animation:k3 26.3s linear infinite"><text class="t" x="761.0" y="249.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2">Planet    distance (AU)    period (yr)</tspan></text></g>
<g style="opacity:0;animation:k3 26.3s linear infinite"><text class="t" x="776.6" y="271.6" xml:space="preserve"><tspan fill="#dcdce2">Mercury   0.387            0.241</tspan></text></g>
<g style="opacity:0;animation:k3 26.3s linear infinite"><text class="t" x="776.6" y="293.6" xml:space="preserve"><tspan fill="#dcdce2">Earth     1.000            1.000       ... 8 rows</tspan></text></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><text class="t" x="761.0" y="337.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#e0a458" font-weight="600">Next step — stage: kepler</tspan></text></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><text class="t" x="776.6" y="359.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">Print a second table from the first: distance cubed, period squared,</tspan></text></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><text class="t" x="776.6" y="381.6" xml:space="preserve"><tspan fill="#74747f">⎿  </tspan><tspan fill="#74747f">and the ratio of the two.</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="761.0" y="425.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#dcdce2">Planet    a³         T²         a³/T²</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="447.6" xml:space="preserve"><tspan fill="#dcdce2">Mercury   0.05796    0.05808    0.99793</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="469.6" xml:space="preserve"><tspan fill="#dcdce2">Jupiter   140.8515   140.7070   1.00103     ... 8 rows</tspan></text></g>
<g style="opacity:0;animation:k5 26.3s linear infinite"><text class="t" x="776.6" y="491.6" xml:space="preserve"><tspan fill="#74747f">every ratio is built from the numbers in the first table</tspan></text></g>
<g style="opacity:0;animation:k6 26.3s linear infinite"><text class="t" x="761.0" y="535.6" xml:space="preserve"><tspan fill="#dcdce2">⏺ </tspan><tspan fill="#8fbf6f" font-weight="600">Run finished — the ratios agree to within 0.21%</tspan></text></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><rect x="9" y="123.6" width="597" height="76.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k2 26.3s linear infinite"><path d="M606.0 161.8 C672 161.8 672 183.6 739.0 183.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 161.8 C672 161.8 672 183.6 739.0 183.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#astep)"/></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><rect x="9" y="195.6" width="597" height="130.3" rx="4" fill="#e0a458" fill-opacity="0.13" stroke="#e0a458" stroke-opacity="0.6"/></g>
<g style="opacity:0;animation:k4 26.3s linear infinite"><path d="M606.0 260.8 C672 260.8 672 337.6 739.0 337.6" fill="none" stroke="#e0a458" stroke-width="5" opacity="0.16" stroke-linecap="round"/><path d="M606.0 260.8 C672 260.8 672 337.6 739.0 337.6" fill="none" stroke="#e0a458" stroke-width="2" opacity="0.95" marker-end="url(#astep)"/></g>
<rect x="761" y="583.6" width="563" height="46.0" rx="9" fill="none" stroke="#32323c"/>
<text class="t" x="777" y="606.6" fill="#74747f">&gt;</text>
<text class="t" x="792.6" y="606.6" fill="#575763">/llajinja run /stages skill</text>
<rect x="792.6" y="598.6" width="8" height="16" fill="#dcdce2" opacity="0.5" style="animation:cur 1.1s step-end infinite"/>
<text class="t" x="777" y="646.1" fill="#74747f">? for shortcuts</text>
</svg>
